name: Data Validation Pipeline
on:
  schedule:
    - cron: '0 * * * *' # Every hour
  workflow_dispatch:     # Manual run trigger

jobs:
  run-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Execute Validation Script
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT || 5432 }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          # Seconds to pause between rules to stay under the Sheets 60 writes/min limit.
          # Tune via a repo variable (Settings > Variables); defaults to 30.
          RULE_DELAY_SECONDS: ${{ vars.RULE_DELAY_SECONDS || 30 }}
        run: python run_validation.py
